<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1119;color:#e5edf8;font:14px system-ui,sans-serif}button,select{font:inherit;color:inherit;background:#202a3a;border:1px solid #344156;border-radius:8px;padding:9px 15px;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #78e4cf}button:disabled{opacity:.35;cursor:default}.panel{background:#141d2a;border:1px solid #2a374a;border-radius:14px;padding:18px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.switch{display:flex;gap:4px;background:#0c131e;padding:4px;border-radius:11px}.switch button{border-color:transparent;background:transparent}.switch button[aria-pressed=true]{background:#28574f;color:#aeffeb;border-color:#3d8677}#play{background:#a6efda;color:#0c2822;font-weight:700;min-width:92px}#clock{font:16px monospace;color:#cbd7ea;min-width:160px}input[type=range]{accent-color:#95e5d1}#seek{width:100%;margin:16px 0}.tracks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}.track{background:#141d2a;border:1px solid #2a374a;border-radius:12px;padding:14px;cursor:pointer}.track.active{border-color:#8bddc7;background:#182e30}.track h3{margin:0;font-size:14px}.track small{color:#98a8be}.wave{display:block;width:100%;height:65px;margin-top:8px}.muted{color:#92a2b9;font-size:12px}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}#roll{display:block;width:100%;height:440px;cursor:crosshair;touch-action:none}.rollwrap{position:relative;margin-top:12px;border:1px solid #2a374a;border-radius:10px;overflow:hidden}#tip{position:absolute;pointer-events:none;background:#26384d;border:1px solid #64819f;border-radius:6px;padding:8px;font-size:12px;white-space:pre-line;display:none;z-index:4}#error{color:#ffb29b;min-height:18px;margin-top:8px}.spacer{flex:1}label{font-size:12px;color:#aab8cc}.view{display:flex;align-items:center;gap:12px;margin-top:12px}#pan{flex:1;min-width:70px}#lyrics{min-height:24px;color:#b8f4e2;font-size:18px;font-weight:600;margin-top:8px}@media(max-width:650px){.tracks{grid-template-columns:1fr}.wave{height:32px}.panel{padding:10px}#clock{font-size:13px}}
</style>
<div class="panel"><div class="toolbar"><button id="play" aria-label="播放或暂停">▶ 播放</button><button id="restart" aria-label="回到起点">↤</button><span id="clock">00:00.00 / 00:00.00</span><div class="spacer"></div><div class="switch" role="group" aria-label="当前播放音源" id="switch"></div><label>速度 <select id="rate"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option></select> ×</label></div><input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="播放进度"><div class="muted">切换音源保留播放位置 · 点击波形或卷帘定位 · 空格播放 / 暂停</div><div id="error" role="status"></div></div>
<div class="tracks" id="tracks"></div>
<div class="panel"><div class="toolbar"><strong>TARGET / PIANO ROLL</strong><span class="muted">MIDI + F0</span><div class="spacer"></div><label><input id="follow" type="checkbox" checked> 跟随播放头</label><label>可见时长 <select id="zoom"><option value="5">5 秒</option><option value="10" selected>10 秒</option><option value="20">20 秒</option><option value="40">40 秒</option><option value="all">全部</option><option value="gesture" hidden>手势缩放</option></select></label></div><div class="legend"><span><i class="dot" style="background:#74859d"></i>1 · 休止 / 间隔</span><span><i class="dot" style="background:#62d9b6"></i>2 · 起始音</span><span><i class="dot" style="background:#ac95f3"></i>3 · 延长音</span><span><i class="dot" style="background:#ffcb71"></i>Target F0</span><span><i class="dot" style="background:#58b9ff"></i>预处理分段边界</span></div><div class="muted">触摸板：双指左右滑动平移 · 双指捏合缩放　|　触屏：双指缩放或平移 · 单指点击定位</div><div class="rollwrap"><canvas id="roll" aria-label="Target MIDI 钢琴卷帘与 F0；点击定位播放时间；触摸板双指滑动或捏合"></canvas><div id="tip"></div></div><div class="view"><span id="window" class="muted"></span><input id="pan" type="range" min="0" max="1" step="0.05" value="0" aria-label="卷帘时间窗口"></div><div id="lyrics"></div></div>
<audio id="audio" preload="metadata"></audio>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('payload').textContent);
const $=id=>document.getElementById(id),audio=$('audio'),canvas=$('roll'),ctx=canvas.getContext('2d');
const colors={1:'#74859d',2:'#62d9b6',3:'#ac95f3'};let active=-1,viewStart=0,viewLength=10,version=0,boxes=[];
const pointers=new Map();let gesture=null,suppressClickUntil=0;
const pitches=data.notes.filter(n=>n.pitch>0).map(n=>n.pitch);
for(const line of data.curves)for(const point of line)if(point[1]!==null&&point[1]>=12&&point[1]<=120)pitches.push(point[1]);
const low=Math.max(0,Math.floor(pitches.length?pitches.reduce((a,b)=>Math.min(a,b),Infinity):48)-2),high=Math.min(127,Math.ceil(pitches.length?pitches.reduce((a,b)=>Math.max(a,b),-Infinity):84)+2);
const fmt=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${(t%60).toFixed(2).padStart(5,'0')}`;
const duration=()=>Number.isFinite(audio.duration)?audio.duration:(data.tracks[active]?.duration||data.duration);
function fit(c){const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;const w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);return [g,r.width,r.height];}
function wave(track,c){const[g,w,h]=fit(c);g.clearRect(0,0,w,h);const peaks=track.peaks||[];g.strokeStyle=track.key===data.tracks[active]?.key?'#8de4cc':'#546b84';g.beginPath();for(let i=0;i<peaks.length;i++){const x=i*w/peaks.length,a=peaks[i]*(h/2-2);g.moveTo(x,h/2-a);g.lineTo(x,h/2+a);}g.stroke();if(track.duration){const x=audio.currentTime/track.duration*w;g.fillStyle='#fff0c7';g.fillRect(x,0,1.5,h);}}
function setTime(t){if(active<0||audio.readyState<1)return;audio.currentTime=Math.min(Math.max(0,t),duration());draw();}
function toggle(){if(active<0)return;if(audio.paused)audio.play().catch(e=>$('error').textContent='无法播放：'+e.message);else audio.pause();}
function choose(i,seekTo=null){if(!data.tracks[i].src)return;if(active===i){if(seekTo!==null)setTime(seekTo);return;}const t=seekTo===null?(audio.currentTime||0):seekTo,playing=!audio.paused;audio.pause();active=i;const token=++version;$('error').textContent='';audio.src=data.tracks[i].src;audio.load();audio.playbackRate=Number($('rate').value);
 const loaded=()=>{if(token!==version)return;audio.currentTime=Math.min(t,duration());audio.playbackRate=Number($('rate').value);if(playing&&t<duration())audio.play().catch(e=>$('error').textContent=e.message);draw();};audio.addEventListener('loadedmetadata',loaded,{once:true});
 for(let j=0;j<data.tracks.length;j++){$('mode'+j).setAttribute('aria-pressed',j===i);$('track'+j).classList.toggle('active',j===i);}draw();}
for(const [i,track] of data.tracks.entries()){
 const b=document.createElement('button');b.id='mode'+i;b.textContent=['Target','Melody','Score'][i];b.disabled=!track.src;b.setAttribute('aria-pressed','false');b.onclick=()=>choose(i);$('switch').appendChild(b);
 const card=document.createElement('div');card.className='track';card.id='track'+i;card.tabIndex=track.src?0:-1;card.setAttribute('role','button');card.setAttribute('aria-label','试听 '+track.name);card.setAttribute('aria-disabled',!track.src);
 const title=document.createElement('h3');title.textContent=track.name;const info=document.createElement('small');info.textContent=track.src?fmt(track.duration)+' · 就绪':({'pending':'等待生成','running':'生成中','failed':'生成失败'}[track.status]||track.status);const c=document.createElement('canvas');c.className='wave';c.id='wave'+i;
 card.append(title,info,c);card.onclick=e=>choose(i,e.target===c&&track.src?(e.clientX-c.getBoundingClientRect().left)/c.clientWidth*track.duration:null);card.onkeydown=e=>{if(e.code==='Enter'){choose(i);}};$('tracks').appendChild(card);
}
function draw(){
 const [g,w,h]=fit(canvas),left=58,top=28,bottom=h-28,row=(bottom-top)/(high-low+1),t=audio.currentTime||0;
 const span=Math.min(viewLength,data.duration||1);if($('follow').checked&&!audio.paused&&(t<viewStart||t>viewStart+span*.9))viewStart=Math.max(0,Math.min(data.duration-span,t-span*.2));
 viewStart=Math.max(0,Math.min(viewStart,Math.max(0,data.duration-span)));const x=v=>left+(v-viewStart)/span*(w-left),y=p=>top+(high-p)*row;
 g.fillStyle='#0c131e';g.fillRect(0,0,w,h);g.font='11px system-ui';g.textBaseline='middle';
 for(let p=low;p<=high;p++){const black=[1,3,6,8,10].includes(p%12),yy=y(p);g.fillStyle=black?'#111b28':'#182331';g.fillRect(left,yy,w-left,row);g.fillStyle=black?'#1c293a':'#354256';g.fillRect(0,yy,left-3,row-1);g.fillStyle='#c7d2e3';if(row>=9||p%12===0)g.fillText(['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'][p%12]+(Math.floor(p/12)-1),5,yy+row/2);}
 const step=span>60?10:span>20?5:span>10?2:1;g.strokeStyle='#2b394b';g.fillStyle='#94a6bc';for(let s=Math.ceil(viewStart/step)*step;s<=viewStart+span;s+=step){const xx=x(s);g.beginPath();g.moveTo(xx,top);g.lineTo(xx,h);g.stroke();g.fillText(s.toFixed(0)+'s',xx+4,12);}
 g.save();g.beginPath();g.rect(left,top,w-left,bottom-top);g.clip();
 for(const [i,segment] of (data.segments||[]).entries()){if(segment.end<viewStart||segment.start>viewStart+span)continue;const x1=x(Math.max(segment.start,viewStart)),x2=x(Math.min(segment.end,viewStart+span));g.fillStyle=i%2?"rgba(88,185,255,.055)":"rgba(88,185,255,.025)";g.fillRect(x1,top,x2-x1,bottom-top);}
 g.strokeStyle="#58b9ff";g.fillStyle="#8dd2ff";g.lineWidth=1;g.setLineDash([5,4]);g.font="bold 10px system-ui";
 for(const segment of (data.segments||[])){for(const boundary of [segment.start,segment.end]){if(boundary<viewStart||boundary>viewStart+span)continue;const xx=x(boundary);g.beginPath();g.moveTo(xx,top);g.lineTo(xx,bottom);g.stroke();}if(segment.start>=viewStart&&segment.start<=viewStart+span)g.fillText(segment.label,x(segment.start)+4,top+9);}
 g.restore();g.setLineDash([]);
 g.fillStyle='#243143';g.fillRect(0,bottom,w,28);g.fillStyle='#a7b6ca';g.fillText('REST',6,bottom+14);boxes=[];g.save();g.beginPath();g.rect(left,top,w-left,h-top);g.clip();
 for(const n of data.notes){if(n.end<viewStart||n.start>viewStart+span)continue;const xx=x(n.start),ww=Math.max(2,x(n.end)-xx-1),yy=n.pitch>0?y(n.pitch)+1:bottom+3,hh=n.pitch>0?Math.max(3,row-2):21;g.fillStyle=colors[n.type];g.globalAlpha=n.pitch>0?.85:.6;g.fillRect(xx,yy,ww,hh);g.globalAlpha=1;if(n.label){g.save();g.beginPath();g.rect(xx,yy,ww,hh);g.clip();g.fillStyle='#071a22';g.font='bold 12px system-ui';g.fillText(n.label,xx+3,yy+hh/2);g.restore();}boxes.push({x:xx,y:yy,w:ww,h:hh,n});}
 g.strokeStyle='#ffcb71';g.lineWidth=1.6;for(const line of data.curves){g.beginPath();let pen=false;for(const [time,pitch] of line){if(pitch===null||time<viewStart||time>viewStart+span){pen=false;continue;}const xx=x(time),yy=y(pitch)+row/2;if(pen)g.lineTo(xx,yy);else g.moveTo(xx,yy);pen=true;}g.stroke();}g.restore();
 if(t>=viewStart&&t<=viewStart+span){g.fillStyle='#fff0c7';g.fillRect(x(t)-1,0,2,h);g.beginPath();g.moveTo(x(t)-5,0);g.lineTo(x(t)+5,0);g.lineTo(x(t),8);g.fill();}
 $('clock').textContent=fmt(t)+' / '+fmt(duration());$('seek').max=duration();$('seek').value=t;$('pan').max=Math.max(0,data.duration-span);$('pan').value=viewStart;$('window').textContent=fmt(viewStart)+' — '+fmt(viewStart+span);$('play').textContent=audio.paused?'▶ 播放':'Ⅱ 暂停';
 const current=data.notes.find(n=>n.start<=t&&t<n.end&&n.lyric!=='<SP>'&&n.lyric!=='<AP>');$('lyrics').textContent=current?current.lyric:'·';for(let i=0;i<data.tracks.length;i++)wave(data.tracks[i],$('wave'+i));
}
canvas.onclick=e=>{if(Date.now()<suppressClickUntil)return;const r=canvas.getBoundingClientRect();if(e.clientX-r.left<58)return;setTime(viewStart+(e.clientX-r.left-58)/(r.width-58)*Math.min(viewLength,data.duration));};
canvas.onmousemove=e=>{const r=canvas.getBoundingClientRect(),xx=e.clientX-r.left,yy=e.clientY-r.top,hit=boxes.find(b=>xx>=b.x&&xx<=b.x+b.w&&yy>=b.y&&yy<=b.y+b.h);$('tip').style.display=hit?'block':'none';if(hit){const n=hit.n;$('tip').textContent=`${n.lyric} · MIDI ${n.pitch}\nType ${n.type} · ${n.start.toFixed(2)}–${n.end.toFixed(2)}s`;$('tip').style.left=Math.max(0,Math.min(xx+12,r.width-240))+'px';$('tip').style.top=Math.max(0,yy-65)+'px';}};canvas.onmouseleave=()=>$('tip').style.display='none';
function beginGesture(){
 if(pointers.size<2)return;const [a,b]=[...pointers.values()].slice(0,2),r=canvas.getBoundingClientRect(),span=Math.min(viewLength,data.duration||1),center=(a.x+b.x)/2-r.left,plot=Math.max(1,r.width-58);
 gesture={distance:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),anchor:viewStart+(center-58)/plot*span,startSpan:span};
 suppressClickUntil=Date.now()+600;$('follow').checked=false;$('tip').style.display='none';
}
canvas.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);if(pointers.size===2)beginGesture();});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size<2||!gesture)return;e.preventDefault();const [a,b]=[...pointers.values()].slice(0,2),r=canvas.getBoundingClientRect(),center=(a.x+b.x)/2-r.left,plot=Math.max(1,r.width-58),distance=Math.max(1,Math.hypot(a.x-b.x,a.y-b.y));
 const minSpan=Math.min(.5,data.duration||.5),newSpan=Math.max(minSpan,Math.min(data.duration||gesture.startSpan,gesture.startSpan*gesture.distance/distance));
 viewLength=newSpan;viewStart=Math.max(0,Math.min(data.duration-newSpan,gesture.anchor-(center-58)/plot*newSpan));$('zoom').value='gesture';draw();
},{passive:false});
function endPointer(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(pointers.size>=2)beginGesture();else gesture=null;}
canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);canvas.addEventListener('lostpointercapture',endPointer);
canvas.addEventListener('wheel',e=>{
 const r=canvas.getBoundingClientRect(),plot=Math.max(1,r.width-58),span=Math.min(viewLength,data.duration||1);
 if(e.ctrlKey){
  const ratio=Math.max(.25,Math.min(4,Math.exp(e.deltaY*.01))),cursor=Math.max(0,Math.min(plot,e.clientX-r.left-58)),anchor=viewStart+cursor/plot*span;
  const minSpan=Math.min(.5,data.duration||.5),newSpan=Math.max(minSpan,Math.min(data.duration||span,span*ratio));
  viewLength=newSpan;viewStart=Math.max(0,Math.min(data.duration-newSpan,anchor-cursor/plot*newSpan));$('zoom').value='gesture';
 }else{
  const pixels=Math.abs(e.deltaX)>.01?e.deltaX:(e.shiftKey?e.deltaY:0);if(Math.abs(pixels)<.01)return;
  viewStart=Math.max(0,Math.min(data.duration-span,viewStart+pixels/plot*span));
 }
 e.preventDefault();$('follow').checked=false;draw();
},{passive:false});
let nativeGesture=null;
canvas.addEventListener('gesturestart',e=>{const r=canvas.getBoundingClientRect(),plot=Math.max(1,r.width-58),span=Math.min(viewLength,data.duration||1),cursor=Math.max(0,Math.min(plot,e.clientX-r.left-58));nativeGesture={span,anchor:viewStart+cursor/plot*span,cursor,plot};e.preventDefault();$('follow').checked=false;},{passive:false});
canvas.addEventListener('gesturechange',e=>{if(!nativeGesture)return;const minSpan=Math.min(.5,data.duration||.5),newSpan=Math.max(minSpan,Math.min(data.duration||nativeGesture.span,nativeGesture.span/Math.max(.01,e.scale)));viewLength=newSpan;viewStart=Math.max(0,Math.min(data.duration-newSpan,nativeGesture.anchor-nativeGesture.cursor/nativeGesture.plot*newSpan));$('zoom').value='gesture';e.preventDefault();draw();},{passive:false});
canvas.addEventListener('gestureend',e=>{nativeGesture=null;e.preventDefault();},{passive:false});
$('play').onclick=toggle;$('restart').onclick=()=>{viewStart=0;setTime(0);};$('seek').oninput=e=>setTime(Number(e.target.value));$('rate').onchange=e=>audio.playbackRate=Number(e.target.value);$('zoom').onchange=e=>{viewLength=e.target.value==='all'?data.duration:Number(e.target.value);draw();};$('pan').oninput=e=>{viewStart=Number(e.target.value);$('follow').checked=false;draw();};
audio.onerror=()=>$('error').textContent='音频解码失败，请检查文件是否完整或换用支持 WAV/MP3/FLAC 的浏览器。';for(const event of ['pause','play','seeked','ended','loadedmetadata'])audio.addEventListener(event,draw);
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();toggle();}});
new ResizeObserver(draw).observe(canvas);const first=data.tracks.findIndex(t=>t.src);if(first>=0)choose(first);else $('play').disabled=true;
function tick(){if(!audio.paused)draw();requestAnimationFrame(tick);}requestAnimationFrame(tick);draw();
</script></html>
